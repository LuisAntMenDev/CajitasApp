<h2 mat-dialog-title>Crear ahorro</h2>
<form (submit)="onSubmit($event)">
    <mat-dialog-content>
        <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput [formField]="createSavingForm.name" />
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Cantidad</mat-label>
            <input matInput type="number" [formField]="createSavingForm.quantity" />
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button type="button" matButton (click)="closeDialog()">Cancelar</button>
        <button type="submit" matButton="filled">Crear</button>
    </mat-dialog-actions>
</form>
